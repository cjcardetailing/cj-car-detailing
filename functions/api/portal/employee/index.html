<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CJ Portal – Employee</title>
  <link rel="icon" href="/favicon.png"/>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .wrap{min-height:100vh;padding:18px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .card{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:14px}
    input,button{border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#fff;padding:8px}
    button{cursor:pointer}
    .muted{opacity:.8;font-size:12px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.10);font-size:13px;text-align:left;vertical-align:top}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h2 style="margin:0;">Employee Dashboard</h2>
      <div class="muted">Your profile + jobs.</div>
    </div>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">Profile</h3>
    <div class="muted" id="pStatus">Loading…</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
      <input id="full_name" placeholder="Full name"/>
      <input id="dob" placeholder="DOB YYYY-MM-DD"/>
      <input id="email" placeholder="Email"/>
      <input id="phone" placeholder="Phone"/>
      <input id="bsb" placeholder="BSB"/>
      <input id="account" placeholder="Account number"/>
      <button id="saveBtn">Save</button>
    </div>
    <div class="muted" style="margin-top:8px;" id="bankInfo"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">My jobs</h3>
    <div style="overflow:auto;">
      <table>
        <thead><tr><th>When</th><th>Job</th><th>Cars</th><th>Pay</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  async function getJSON(url){
    const r = await fetch(url, {credentials:"include"});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function postJSON(url, body){
    const r = await fetch(url, {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(body||{}),
      credentials:"include"
    });
    const t = await r.text();
    let j=null; try{j=JSON.parse(t)}catch{}
    if(!r.ok) throw new Error(j?.error || t);
    return j;
  }
  function aud(c){return (c/100).toLocaleString("en-AU",{style:"currency",currency:"AUD"});}

  async function ensureEmployee(){
    const me = await getJSON("/api/portal/me");
    if(me?.user?.role!=="EMPLOYEE") location.href="/portal/";
  }

  async function loadProfile(){
    const j = await getJSON("/api/portal/employee/profile");
    const p = j.profile || {};
    document.getElementById("full_name").value = p.full_name || "";
    document.getElementById("dob").value = p.dob || "";
    document.getElementById("email").value = p.email || "";
    document.getElementById("phone").value = p.phone || "";
    document.getElementById("pStatus").textContent = `Bank locked: ${p.bank_locked ? "YES" : "NO"}`;
    document.getElementById("bankInfo").textContent =
      p.bank?.hasBank ? `Bank: ${p.bank.bsbMasked} / ${p.bank.accountMasked}` : "Bank not set yet.";
    if (p.bank_locked) {
      document.getElementById("bsb").disabled = true;
      document.getElementById("account").disabled = true;
      document.getElementById("bsb").placeholder = "Locked";
      document.getElementById("account").placeholder = "Locked";
    }
  }

  async function loadJobs(){
    const j = await getJSON("/api/portal/employee/jobs");
    const tbody = document.getElementById("jobs");
    tbody.innerHTML = "";
    for(const x of (j.jobs||[])){
      const when = new Date(x.start_time+"Z");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${when.toLocaleString()}</td>
        <td><b>${x.title||""}</b><div class="muted">${x.location||""}</div></td>
        <td>${x.cars_count}</td>
        <td>${aud(x.employee_pay_cents)}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  document.getElementById("saveBtn").addEventListener("click", async ()=>{
    const body = {
      full_name: document.getElementById("full_name").value.trim(),
      dob: document.getElementById("dob").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      bsb: document.getElementById("bsb").value.trim(),
      account: document.getElementById("account").value.trim(),
    };
    await postJSON("/api/portal/employee/profile-save", body);
    alert("Saved!");
    await loadProfile();
  });

  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    await fetch("/api/portal/logout", {method:"POST", credentials:"include"});
    location.href="/portal/";
  });

  (async ()=>{
    await ensureEmployee();
    await loadProfile();
    await loadJobs();
  })();
</script>
</body>
</html>
