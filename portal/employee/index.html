<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CJ Portal – Employee</title>
  <link rel="icon" href="/favicon.png"/>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="stylesheet" href="/portal/portal.css"/>
</head>
<body>
<div class="portal-bg">
  <div class="portal-layout">
    <aside class="portal-side">
      <div class="portal-brand">
        <img src="/favicon.png" alt="CJ">
        <div>
          <b>Employee Portal</b>
          <div class="sub" id="sideLine">Loading…</div>
        </div>
      </div>

      <div class="portal-nav">
        <button data-tab="dash" class="active">Dashboard</button>
        <button data-tab="profile">Profile</button>
        <button data-tab="jobs">Jobs</button>
        <button data-tab="availability">Availability</button>
      </div>

      <div style="margin-top:14px;">
        <button id="logoutBtn" class="secondary" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="portal-main">
      <div class="portal-top">
        <div>
          <h2 style="margin:0;">CJ Employee</h2>
          <div class="muted">Your earnings, jobs, and availability.</div>
        </div>
      </div>

      <!-- DASH -->
      <section id="tab-dash" class="portal-card">
        <div class="portal-grid" id="earnGrid"></div>

        <div class="portal-card" style="margin-top:12px;">
          <div class="k">Earnings</div>
          <canvas id="earnChart" style="width:100%;height:220px;margin-top:10px;"></canvas>
          <div class="small">Week / Month / Year.</div>
        </div>
      </section>

      <!-- PROFILE -->
      <section id="tab-profile" class="portal-card hidden">
        <b>Profile</b>
        <div class="small" id="pStatus">Loading…</div>

        <div class="portal-row" style="margin-top:10px;">
          <input id="full_name" placeholder="Full name"/>
          <input id="dob" placeholder="DOB YYYY-MM-DD"/>
          <input id="email" placeholder="Email"/>
          <input id="phone" placeholder="Phone"/>
          <input id="bsb" placeholder="BSB"/>
          <input id="account" placeholder="Account number"/>
          <button id="saveBtn">Save</button>
        </div>

        <div class="small" style="margin-top:8px;" id="bankInfo"></div>
      </section>

      <!-- JOBS -->
      <section id="tab-jobs" class="portal-card hidden">
        <b>My jobs</b>
        <div class="small">Jobs disappear when manager marks them done.</div>
        <div style="overflow:auto;margin-top:10px;">
          <table>
            <thead><tr>
              <th>When (DD/MM/YYYY)</th>
              <th>Job</th>
              <th>Cars</th>
              <th>Pay</th>
            </tr></thead>
            <tbody id="jobsT"></tbody>
          </table>
        </div>
      </section>

      <!-- AVAILABILITY -->
      <section id="tab-availability" class="portal-card hidden">
        <b>Availability (this week)</b>
        <div class="small">Example: “Mon 4–7pm, Wed after 3pm…”</div>
        <textarea id="availText" rows="6" style="width:100%;margin-top:10px;"></textarea>
        <div class="portal-row" style="margin-top:10px;">
          <button id="availSave">Save Availability</button>
          <div class="small" id="availMsg"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  const $=(id)=>document.getElementById(id);
  const tabs=["dash","profile","jobs","availability"];

  function aud(c){ return (c/100).toLocaleString("en-AU",{style:"currency",currency:"AUD"}); }

  function formatDMY(dt){
    const d = String(dt.getDate()).padStart(2,"0");
    const m = String(dt.getMonth()+1).padStart(2,"0");
    const y = dt.getFullYear();
    const hh = String(dt.getHours()).padStart(2,"0");
    const mm = String(dt.getMinutes()).padStart(2,"0");
    return `${d}/${m}/${y} ${hh}:${mm}`;
  }

  async function getJSON(url){
    const r=await fetch(url,{credentials:"include"});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function postJSON(url, body){
    const r=await fetch(url,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(body||{}),
      credentials:"include"
    });
    const t=await r.text();
    let j=null; try{j=JSON.parse(t)}catch{}
    if(!r.ok) throw new Error(j?.error || t);
    return j;
  }

  function showTab(name){
    for(const t of tabs){
      document.querySelector(`[data-tab="${t}"]`).classList.toggle("active", t===name);
      document.getElementById(`tab-${t}`).classList.toggle("hidden", t!==name);
    }
  }
  document.querySelectorAll(".portal-nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));

  $("logoutBtn").addEventListener("click", async ()=>{
    await fetch("/api/portal/logout",{method:"POST",credentials:"include"});
    location.href="/portal/";
  });

  function fitCanvas(canvas, cssHeight){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return ctx;
  }

  function drawBarChart(canvas, labels, values){
    const ctx = fitCanvas(canvas, 220);
    const W = canvas.getBoundingClientRect().width;
    const H = 220;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    ctx.fillRect(0,0,W,H);

    const pad = 18;
    const max = Math.max(...values, 1);
    const n = values.length;
    const slot = (W - pad*2) / n;
    const barW = Math.min(90, slot * 0.55);

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.beginPath();
    ctx.moveTo(pad, H-pad);
    ctx.lineTo(W-pad, H-pad);
    ctx.stroke();

    values.forEach((v,i)=>{
      const h = (H - pad*2) * (v/max);
      const x = pad + i*slot + (slot - barW)/2;
      const y = (H - pad) - h;

      ctx.fillStyle = "rgba(212,175,55,0.35)";
      ctx.fillRect(x,y,barW,h);

      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto";
      ctx.fillText(labels[i], x, H-6);
    });
  }

  async function loadSidebar(){
    const p = await getJSON("/api/portal/employee/profile");
    const name = p.profile?.full_name || "Employee";
    const y = p.profile?.age_years ?? "";
    const m = p.profile?.age_months ?? "";
    const age = (y!=="" && m!=="") ? `${y}y ${m}m` : "";
    const username = p.profile?.username || "";
    $("sideLine").textContent = `${name}${age ? " • "+age : ""} • Account: ${username}`;
  }

  async function ensureEmployee(){
    const me = await getJSON("/api/portal/me");
    if(me?.user?.role!=="EMPLOYEE") location.href="/portal/";
  }

  async function loadEarnings(){
    const s = await getJSON("/api/portal/employee/summary");
    const g = $("earnGrid");
    g.innerHTML="";

    const blocks = [["This week", s.week],["This month", s.month],["This year", s.year]];
    const vals = [s.week.pay_cents, s.month.pay_cents, s.year.pay_cents];

    for(const [label,v] of blocks){
      const d=document.createElement("div");
      d.className="portal-card";
      d.style.margin="0";
      d.innerHTML = `
        <div class="k">${label}</div>
        <div class="v">${v.pay_fmt}</div>
        <div class="small">Jobs: <b>${v.jobs}</b></div>`;
      g.appendChild(d);
    }

    drawBarChart($("earnChart"), ["Week","Month","Year"], vals);
  }

  async function loadProfile(){
    const j = await getJSON("/api/portal/employee/profile");
    const p = j.profile || {};
    $("full_name").value = p.full_name || "";
    $("dob").value = p.dob || "";
    $("email").value = p.email || "";
    $("phone").value = p.phone || "";
    $("pStatus").textContent = `Bank locked: ${p.bank_locked ? "YES" : "NO"}`;
    $("bankInfo").textContent = p.bank?.hasBank ? `Bank: ${p.bank.bsbMasked} / ${p.bank.accountMasked}` : "Bank not set yet.";
    if (p.bank_locked) {
      $("bsb").disabled = true;
      $("account").disabled = true;
      $("bsb").placeholder = "Locked";
      $("account").placeholder = "Locked";
    }
  }

  async function loadJobs(){
    const j = await getJSON("/api/portal/employee/jobs");
    const tbody = $("jobsT");
    tbody.innerHTML="";
    for(const x of (j.jobs||[])){
      const when = new Date(x.start_time);
      const whenText = isNaN(when.getTime()) ? (x.start_time || "") : formatDMY(when);
      const tr=document.createElement("tr");
      tr.innerHTML = `
        <td>${whenText}</td>
        <td><b>${x.title||""}</b><div class="small">${x.location||""}</div></td>
        <td>${x.cars_count}</td>
        <td>${aud(x.employee_pay_cents)}</td>`;
      tbody.appendChild(tr);
    }
  }

  $("saveBtn").addEventListener("click", async ()=>{
    const body={
      full_name:$("full_name").value.trim(),
      dob:$("dob").value.trim(),
      email:$("email").value.trim(),
      phone:$("phone").value.trim(),
      bsb:$("bsb").value.trim(),
      account:$("account").value.trim()
    };
    await postJSON("/api/portal/employee/profile-save", body);
    alert("Saved ✅");
    await loadProfile();
    await loadSidebar();
  });

  async function loadAvail(){
    const j = await getJSON("/api/portal/employee/availability");
    $("availText").value = j.availability?.text || "";
  }

  $("availSave").addEventListener("click", async ()=>{
    $("availMsg").textContent = "";
    await postJSON("/api/portal/employee/availability", { availability: { text: $("availText").value.trim() } });
    $("availMsg").textContent = "Saved ✅";
  });

  window.addEventListener("resize", ()=> {
    loadEarnings().catch(()=>{});
  });

  (async ()=>{
    await ensureEmployee();
    await loadSidebar();
    await loadEarnings();
    await loadProfile();
    await loadJobs();
    await loadAvail();
  })();
</script>
</body>
</html>
