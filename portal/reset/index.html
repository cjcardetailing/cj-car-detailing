<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CJ Portal – Reset Password</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .portal-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
    .portal-card { width: 100%; max-width: 460px; border-radius: 18px; padding: 22px; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); }
    .portal-title { margin: 0 0 6px; font-size: 22px; }
    .portal-sub { margin: 0 0 18px; opacity: .85; font-size: 13px; }
    label { display:block; font-size: 12px; opacity: .9; margin: 10px 0 6px; }
    input { width:100%; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.35); color: #fff; outline: none; }
    input:focus { border-color: rgba(255,255,255,0.35); }
    .actions { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-top: 14px; }
    .btn { padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.10); color:#fff; cursor:pointer; }
    .btn:hover { background: rgba(255,255,255,0.14); }
    .btn-primary { background: rgba(255,255,255,0.18); }
    .btn-primary:hover { background: rgba(255,255,255,0.22); }
    .error { margin-top: 10px; color: #ffd2d2; font-size: 12px; display:none; }
    .success { margin-top: 10px; color: #d2ffd9; font-size: 12px; display:none; }
    .muted { opacity:.8; font-size: 12px; }
    .token-box { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; opacity:.8; overflow:hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-card">
      <h1 class="portal-title">Reset Password</h1>
      <p class="portal-sub">Set a new password for your CJ Portal account.</p>

      <p class="muted" style="margin:0 0 8px;">Reset token detected:</p>
      <div class="token-box" id="tokenPreview">—</div>

      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 10 characters" />

      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-type password" />

      <div class="actions">
        <button class="btn btn-primary" id="resetBtn">Reset password</button>
        <a class="btn" href="/portal/" style="text-decoration:none; text-align:center;">Back to login</a>
      </div>

      <div class="error" id="err"></div>
      <div class="success" id="ok"></div>

      <p class="muted" style="margin-top:14px;">
        Tip: Use a strong password with numbers + symbols.
      </p>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  function show(el, yes) { el.style.display = yes ? "block" : "none"; }
  function setText(el, txt) { el.textContent = txt; }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("token") || "";
  }

  async function resetPassword(token, newPassword) {
    const res = await fetch("/api/portal/password/reset", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, newPassword }),
    });

    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}

    return { ok: res.ok, status: res.status, data, text };
  }

  const token = getTokenFromUrl();
  $("tokenPreview").textContent = token ? token : "No token found in URL (missing ?token=...)";

  $("resetBtn").addEventListener("click", async () => {
    show($("err"), false);
    show($("ok"), false);

    const pw1 = $("pw1").value;
    const pw2 = $("pw2").value;

    if (!token) {
      setText($("err"), "Missing token. Use the link from your email.");
      show($("err"), true);
      return;
    }

    if (!pw1 || pw1.length < 10) {
      setText($("err"), "Password must be at least 10 characters.");
      show($("err"), true);
      return;
    }

    if (pw1 !== pw2) {
      setText($("err"), "Passwords do not match.");
      show($("err"), true);
      return;
    }

    const r = await resetPassword(token, pw1);

    if (!r.ok) {
      // Your API returns plain text for some errors; show whichever is available.
      const msg = (r.data && (r.data.error || r.data.details)) || r.text || "Reset failed.";
      setText($("err"), msg);
      show($("err"), true);
      return;
    }

    setText($("ok"), "Password updated. You can now log in.");
    show($("ok"), true);

    // Optional: auto-redirect after a moment
    setTimeout(() => { window.location.href = "/portal/"; }, 1200);
  });
</script>
</body>
</html>
